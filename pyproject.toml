[project]
name = "offer-planner"
version = "0.1.0"
description = "Brief → publishers, personas, creatives and a campaign config (Disco take-home)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langfuse>=4.15.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501", "E741", "E742", "B008", "UP046", "UP040"]
